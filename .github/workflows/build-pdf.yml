name: Build PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
      - run: make pdf
      - uses: actions/upload-artifact@v4
        with:
          name: veil-pdfs
          path: out/*.pdf
