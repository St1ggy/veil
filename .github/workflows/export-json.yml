name: Export JSON API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m venv .venv && .venv/bin/pip install PyYAML jsonschema python-frontmatter
      - run: make api
      - uses: actions/upload-artifact@v7
        with:
          name: veil-api
          path: api/
