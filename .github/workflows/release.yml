name: Release

on:
  push:
    tags: ["books/**", "v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: typst-community/setup-typst@v4
      - run: python3 -m venv .venv && .venv/bin/pip install PyYAML jsonschema python-frontmatter
      - run: make validate index pdf api
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.pdf
            api/**/*
